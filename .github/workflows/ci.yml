name: CI

# Every push and pull request builds the solution and runs every test, the integration and slow
# ones included, on Windows, Linux and macOS at once. The process sandbox is enforced differently
# on each (AppContainer, Landlock, Seatbelt), so its tests only prove something on all three.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # A runner that cannot enforce the sandbox fails the sandbox tests instead of skipping them.
      AI_SANDBOX_REQUIRED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build AI.slnx --nologo
      - name: Test
        run: dotnet test --solution AI.slnx --no-build --results-directory artifacts/test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
