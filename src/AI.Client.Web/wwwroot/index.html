<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="app-icon.svg" />
    <link rel="stylesheet" href="css/app.css" />
    <title>AI Client</title>
    <script src="js/vendor/mermaid.min.js"></script>
    <script>
        // Mermaid is loaded eagerly so that the JS module driving fence rendering can find a
        // ready global. startOnLoad is off because we render fences as they land in the feed
        // through a MutationObserver (see js/mermaidBlocks.js); letting mermaid run on document
        // load would walk the entire app shell and race with the observer for the same nodes.
        // theme 'base' reads CSS variables from :root so the diagrams pick up the app's dark
        // palette (background, text, accent) without a second hardcoded colour scheme.
        // securityLevel 'strict' disables mermaid's own click handling — diagrams stay inert
        // links and the existing CSP / no-raw-html pipeline in SafeMarkdownRenderer is the only
        // authority on what is rendered.
        (function () {
            if (!window.mermaid) return;
            // `background` and `color` on :root are CSS shorthand values: querying them via
            // getComputedStyle returns the whole shorthand (color + image + repeat + position +
            // size + origin + clip) which mermaid's color parser cannot understand. Read the
            // longhand `background-color` instead, and pull `font-family` separately because
            // it is what mermaid actually consumes.
            const root = getComputedStyle(document.documentElement);
            const bg = root.getPropertyValue('background-color').trim() || '#0c1017';
            const fg = root.getPropertyValue('color').trim() || '#edf2f7';
            const ff = root.getPropertyValue('font-family').trim() || 'Inter, system-ui, sans-serif';
            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                securityLevel: 'strict',
                fontFamily: ff,
                themeVariables: {
                    background: bg,
                    primaryColor: bg,
                    primaryTextColor: fg,
                    primaryBorderColor: '#2a3441',
                    lineColor: fg,
                    secondaryColor: '#161b24',
                    tertiaryColor: '#11161e',
                    fontFamily: ff
                }
            });
        })();
    </script>
</head>
<body>
    <div id="app">
        <main class="app-loading" aria-label="Loading application" aria-live="polite">
            <div class="app-loading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="app-loading-copy"><strong>AI.Client</strong><span>Preparing your workspace</span></div>
            <div class="app-loading-track" role="progressbar" aria-label="Loading" aria-valuetext="Loading application"><span></span></div>
        </main>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss">Dismiss</button>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
