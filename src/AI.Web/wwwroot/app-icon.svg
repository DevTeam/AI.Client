<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI Agentic Chat Client</title>
  <desc id="desc">Тёмная квадратная иконка: три светлые строки сообщений чата над полем ввода с голубой обводкой и белой круглой кнопкой отправки в правой нижней части поля.</desc>

  <!-- Фон в стиле тёмной темы приложения -->
  <rect width="64" height="64" rx="14" ry="14" fill="#171717"/>

  <!-- Три строки сообщений (убывающая длина для эффекта стенограммы) -->
  <g fill="#ececec">
    <rect x="12" y="14" width="34" height="3" rx="1.5"/>
    <rect x="12" y="21" width="40" height="3" rx="1.5"/>
    <rect x="12" y="28" width="22" height="3" rx="1.5"/>
  </g>

  <!-- Поле ввода: слегка скруглённый прямоугольник с голубой обводкой -->
  <rect x="13" y="41" width="38" height="12" rx="4" ry="4"
        fill="none" stroke="#4f91dc" stroke-width="2"/>

  <!-- Кнопка отправки в правой нижней части поля -->
  <circle cx="45" cy="47" r="3" fill="#ffffff"/>
</svg>
