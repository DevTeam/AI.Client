<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="app-icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#171717" />
    <script src="js/theme.js"></script>
    <script src="js/hostBridge.js"></script>
    <script src="js/notificationSound.js"></script>
    <script src="js/hoverSound.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <title>AI Client</title>
    <script src="js/vendor/mermaid.min.js"></script>
    <script src="js/tooltips.js"></script>
    <script src="js/drawerTransitions.js"></script>
    <script src="js/messageReviews.js"></script>
    <script src="js/messageActions.js"></script>
    <script src="js/reviewWorkspace.js"></script>
    <script>
        // Mermaid is loaded eagerly so that the JS module driving fence rendering can find a
        // ready global. startOnLoad is off because we render fences as they land in the feed
        // through a MutationObserver (see js/mermaidBlocks.js); letting mermaid run on document
        // load would walk the entire app shell and race with the observer for the same nodes.
        // theme 'base' takes its palette from the app's --color-* tokens, read again whenever
        // js/theme.js switches the theme, so diagrams rendered after a switch match the page.
        // securityLevel 'strict' disables mermaid's own click handling — diagrams stay inert
        // links and the existing CSP / no-raw-html pipeline in SafeMarkdownRenderer is the only
        // authority on what is rendered.
        (function () {
            if (!window.mermaid) return;
            function configure() {
                const root = getComputedStyle(document.documentElement);
                const token = name => root.getPropertyValue(name).trim();
                const ff = root.getPropertyValue('font-family').trim() || 'Inter, system-ui, sans-serif';
                mermaid.initialize({
                    startOnLoad: false,
                    // A failed render must remove Mermaid's temporary SVG from document.body.
                    // The message renderer shows the parse error inside the chat instead.
                    suppressErrorRendering: true,
                    theme: 'base',
                    securityLevel: 'strict',
                    fontFamily: ff,
                    themeVariables: {
                        darkMode: document.documentElement.dataset.theme !== 'light',
                        background: token('--color-bg'),
                        primaryColor: token('--color-surface-raised'),
                        primaryTextColor: token('--color-text'),
                        primaryBorderColor: token('--color-border-strong'),
                        lineColor: token('--color-text-muted'),
                        secondaryColor: token('--color-fill'),
                        tertiaryColor: token('--color-surface'),
                        fontFamily: ff
                    }
                });
            }
            configure();
            document.addEventListener('ai-client-theme-change', configure);
        })();
    </script>
</head>
<body>
    <div id="app">
        <main class="app-loading" aria-label="Loading application" aria-live="polite">
        <img class="app-loading-mark" src="app-icon.svg" width="128" height="128" alt="" />
            <div class="app-loading-copy"><strong>AI Client</strong><span>Preparing your workspace</span></div>
            <div class="app-loading-track" role="progressbar" aria-label="Loading" aria-valuetext="Loading application"><span></span></div>
        </main>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss">Dismiss</button>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>globalThis.aiClientSettingsReady.then(() => Blazor.start());</script>
</body>
</html>
